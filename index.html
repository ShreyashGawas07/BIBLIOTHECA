<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bibliotheca · My Reading Archive</title>
<meta name="theme-color" content="#191918">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#e8e2d4;--panel:#f1ece0;--ink:#1c1b19;--mut:#6f695d;--line:#1c1b19;--soft:#1c1b1926;--hov:#1c1b190d;--dark:#191918;--dk:#e8e2d4;--dkm:#8f897c;--ok:#4d7a4b;--amb:#b5852c;--red:#a4452f;--sel:#1c1b19;--selink:#f1ece0}
[data-theme=night]{--paper:#141412;--panel:#1b1b18;--ink:#e4ddcc;--mut:#8f897b;--line:#4a473f;--soft:#e4ddcc1f;--hov:#e4ddcc0d;--dark:#0d0d0c;--sel:#e4ddcc;--selink:#141412}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:12.5px/1.45 "IBM Plex Mono",ui-monospace,monospace;background:var(--paper);color:var(--ink);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);border:1px solid var(--line);padding:6px 10px;text-transform:uppercase;letter-spacing:.06em;font-size:11px;border-radius:2px}
button:hover{background:var(--ink);color:var(--panel)}button:active{transform:translateY(1px)}
button.x{border:0;background:none;padding:2px 6px}button.x:hover{background:var(--hov);color:var(--ink)}
button.solid{background:var(--ink);color:var(--panel)}button.solid:hover{opacity:.85}
input,select,textarea{background:var(--panel);border:1px solid var(--line);padding:6px 8px;border-radius:2px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 2px var(--soft)}
.U{text-transform:uppercase;letter-spacing:.08em}.m{color:var(--mut)}.s{font-size:10.5px}
.app{display:grid;grid-template-columns:230px 1fr 330px;height:100vh;height:100dvh}
/* ---------- sidebar ---------- */
.side{background:var(--dark);color:var(--dk);display:flex;flex-direction:column;overflow:auto;border-right:1px solid #000}
.brand{display:flex;gap:10px;align-items:center;padding:16px 14px;border-bottom:1px solid #ffffff1c}
.brand b{font-size:19px;letter-spacing:.14em;font-weight:500;display:block}.brand small{color:var(--dkm);font-size:9.5px;letter-spacing:.08em;line-height:1.3;display:block}
.sbox{margin:12px 14px;border:1px solid #ffffff2a;padding:8px 10px;font-size:10px;letter-spacing:.07em}
.sbox div{display:flex;justify-content:space-between;padding:2px 0}.sbox .led{display:inline-block;width:7px;height:7px;border-radius:50%;background:#6fae6c;margin-right:6px;box-shadow:0 0 6px #6fae6c}
.sh{font-size:9.5px;color:var(--dkm);letter-spacing:.12em;padding:12px 14px 6px}
nav a{display:flex;align-items:center;gap:10px;padding:7px 14px;margin:1px 8px;border-radius:2px;cursor:pointer;letter-spacing:.08em;font-size:11.5px;text-transform:uppercase;color:var(--dk)}
nav a:hover{background:#ffffff12}nav a.on{background:var(--dk);color:var(--dark)}
nav a i{font-style:normal;width:16px;text-align:center;opacity:.8}nav a em{margin-left:auto;font-style:normal;font-size:10px;opacity:.6}
.recent a{display:block;padding:3px 14px 3px 22px;color:var(--dkm);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.recent a:hover{color:var(--dk)}.recent a::before{content:"› "}
.sys{margin-top:auto;padding:10px 14px;border-top:1px solid #ffffff1c;font-size:10px;letter-spacing:.06em}
.sys div{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:3px 0}
.sys .bar{height:3px;background:#ffffff22}.sys .bar i{display:block;height:100%;background:var(--dk)}
.ver{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid #ffffff1c;font-size:10px;letter-spacing:.1em}
.ver button{background:none;color:var(--dk);border-color:#ffffff33}
/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:0 14px;height:44px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.top .clk{letter-spacing:.1em;font-size:11.5px}.top .clk span{margin-left:16px}.sp{flex:1}
#burger{display:none}
.content{flex:1;overflow:auto;padding:14px}
.bot{display:flex;gap:18px;align-items:center;height:28px;padding:0 14px;border-top:1px solid var(--line);background:var(--dark);color:var(--dk);font-size:10px;letter-spacing:.1em;flex:none;white-space:nowrap;overflow:hidden}
.bot .ok{color:#8fc98c}
/* ---------- panels ---------- */
.pn{background:var(--panel);border:1px solid var(--line);min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.ph a{font-weight:400;font-size:10px;cursor:pointer;color:var(--mut)}.ph a:hover{color:var(--ink)}
.pb{padding:10px}
.row{display:grid;gap:12px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:1.45fr 1fr 1fr 1fr 1fr;border:1px solid var(--line);background:var(--panel);margin-bottom:12px}
.tile{padding:10px 12px;border-right:1px solid var(--line);min-width:0}.tile:last-child{border:0}
.tile h4{margin:0 0 6px;font-size:10.5px;letter-spacing:.12em;font-weight:600}
.big{font-size:40px;line-height:1;font-weight:500;letter-spacing:-.02em}
.tile ul{list-style:none;margin:8px 0 0;padding:0;font-size:11px}.tile li{display:flex;gap:6px;padding:1px 0}.tile li b{min-width:22px}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:9.5px;text-align:center;margin-top:6px}
.mcal span{padding:1px 0;color:var(--mut)}.mcal .r{background:var(--ink);color:var(--panel)}.mcal .t{outline:1px solid var(--ink)}
.bars{display:flex;align-items:flex-end;gap:5px;height:56px;margin-top:10px}.bars div{flex:1;background:var(--ink);min-height:2px;position:relative}
.bars div.z{background:var(--soft)}.bl{display:flex;gap:5px;font-size:9px;color:var(--mut)}.bl span{flex:1;text-align:center}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px}
.card{border:1px solid var(--line);cursor:pointer;background:var(--panel);transition:.15s;min-width:0}.card:hover{transform:translateY(-2px);box-shadow:3px 3px 0 var(--ink)}
.card.on{box-shadow:3px 3px 0 var(--ink)}
.cv{aspect-ratio:3/4;background:var(--soft) center/cover no-repeat;border-bottom:1px solid var(--line);filter:sepia(.35) saturate(.8) contrast(1.05);transition:filter .3s;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);position:relative}
.card:hover .cv,.card.on .cv{filter:none}
.cv.wide{aspect-ratio:16/10;background-position:center 30%}
.card .ci{padding:7px 8px}.card .ct{font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.kv{display:grid;grid-template-columns:62px 1fr;font-size:10.5px;gap:1px 6px;margin-top:4px}.kv span:nth-child(odd){color:var(--mut)}
.stamp{position:absolute;top:8px;right:8px;border:1.5px solid var(--ok);color:var(--ok);background:#f1ece0e8;font-size:9.5px;font-weight:700;letter-spacing:.12em;padding:2px 6px;transform:rotate(-6deg)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.st-reading{background:var(--amb)}.st-finished{background:var(--ok)}.st-want{border:1.5px solid var(--mut)}.st-dropped{background:var(--red)}
table{width:100%;border-collapse:collapse;font-size:11.5px}th{text-align:left;font-weight:500;color:var(--mut);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:6px 10px;border-bottom:1px solid var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--hov)}tbody tr.on{background:var(--sel);color:var(--selink)}
.pbar{height:6px;border:1px solid var(--line);min-width:60px}.pbar i{display:block;height:100%;background:var(--ink)}
.pips{letter-spacing:1px}
.two{grid-template-columns:1.7fr 1fr}.twoe{grid-template-columns:1fr 1fr}
textarea{resize:vertical;min-height:70px}
.tmr{display:flex;align-items:center;gap:10px;margin:10px 0}.tmr b{font-size:22px;font-weight:500;letter-spacing:.05em}
.meter{display:flex;gap:2px;height:12px;margin-top:4px}.meter i{flex:1;background:var(--soft)}.meter i.f{background:var(--ink)}
.shelf{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:10px}
.shelf .cv{border:1px solid var(--line);cursor:pointer;font-size:9px}
.badge{display:inline-block;border:1px solid var(--line);padding:0 6px;font-size:10px;letter-spacing:.04em;border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{border:1px solid var(--line);padding:1px 7px;font-size:10.5px;display:inline-flex;gap:6px;align-items:center;border-radius:2px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--panel)}
.empty{padding:30px 16px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);letter-spacing:.1em;margin-bottom:6px}
/* ---------- inspector ---------- */
.insp{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.insp .ih{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 12px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.12em;font-weight:600;flex:none}
.insp .ib{flex:1;overflow:auto}
.sec{padding:12px;border-bottom:1px solid var(--line)}
.sec h5{margin:0 0 8px;font-size:10px;letter-spacing:.12em;color:var(--mut);font-weight:500}
.rid{font-size:15px;font-weight:600;letter-spacing:.08em;border:1px solid var(--line);padding:6px 8px;display:flex;justify-content:space-between;align-items:center}
.kv2{display:grid;grid-template-columns:78px 1fr;gap:6px 8px;font-size:11.5px;margin-top:10px;align-items:center}.kv2>span:nth-child(odd){color:var(--mut)}
.kv2 select,.kv2 input{padding:3px 6px}
.ititle{font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;line-height:1.25;margin:0 0 4px}
.icv{display:flex;gap:12px}.icv .cv{width:84px;flex:none;border:1px solid var(--line);filter:none}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs a{flex:1;text-align:center;padding:8px 2px;font-size:10px;letter-spacing:.1em;cursor:pointer;border-right:1px solid var(--line)}.tabs a:last-child{border:0}
.tabs a.on{background:var(--ink);color:var(--panel)}
.ring{display:flex;gap:14px;align-items:center}
.ms div{display:flex;justify-content:space-between;padding:2px 0;font-size:11px}.ms .dn{font-weight:600}
.stars button{border:0;background:none;padding:0 2px;font-size:17px;color:var(--soft);letter-spacing:0}.stars button.on{color:var(--ink)}.stars button:hover{background:none;color:var(--amb)}
.quote{border-left:2px solid var(--ink);padding:4px 0 4px 10px;margin-bottom:10px;font-style:italic}.quote small{display:block;font-style:normal;color:var(--mut);margin-top:3px}
details summary{cursor:pointer;font-size:10px;letter-spacing:.12em;color:var(--mut)}
.linked div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--soft);cursor:pointer}.linked div:hover{background:var(--hov)}
/* ---------- search palette ---------- */
dialog{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0;width:min(640px,96vw);border-radius:2px;box-shadow:6px 6px 0 var(--ink)}
dialog::backdrop{background:#191918aa}
.pal input{border:0;border-bottom:1px solid var(--line);padding:14px;font-size:15px;box-shadow:none!important}
#res{max-height:62vh;overflow:auto}
.res{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--soft);align-items:center}
.res .cv{width:44px;flex:none;border:1px solid var(--line);filter:none;font-size:0}
.res .mm{flex:1;min-width:0}.res .mm b{display:block;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.have{color:var(--ok);font-weight:600;font-size:11px;letter-spacing:.06em}
.kbd{border:1px solid var(--line);padding:0 4px;font-size:10px}
/* ---------- views ---------- */
.tool{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tool input{max-width:260px}.tool select{width:auto}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:2px;overflow:auto;padding:10px}
.heat i{width:11px;height:11px;background:var(--soft)}.heat .l1{background:#1c1b1955}.heat .l2{background:#1c1b1999}.heat .l3{background:#1c1b19cc}.heat .l4{background:var(--ink)}
[data-theme=night] .heat .l1{background:#e4ddcc44}[data-theme=night] .heat .l2{background:#e4ddcc88}[data-theme=night] .heat .l3{background:#e4ddccbb}
.hbar{display:grid;grid-template-columns:120px 1fr 40px;gap:8px;align-items:center;padding:3px 0}.hbar .pbar{height:10px}
.mon{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;padding:10px}.mon>div{border:1px solid var(--soft);min-height:120px;padding:4px}
.mon h6{margin:0 0 4px;font-size:10px;letter-spacing:.1em;font-weight:500;color:var(--mut)}.mon .cv{margin-bottom:4px;border:1px solid var(--line);cursor:pointer;font-size:0}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--panel);margin-bottom:12px}.kpi>div{padding:12px;border-right:1px solid var(--line)}.kpi>div:last-child{border:0}
#toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,90px);background:var(--ink);color:var(--panel);padding:8px 16px;letter-spacing:.08em;font-size:11px;text-transform:uppercase;transition:.25s;z-index:99;border-radius:2px}
#toast.on{transform:translate(-50%,0)}
.scrim{display:none}
@media(max-width:1250px){.app{grid-template-columns:230px 1fr}.insp{position:fixed;right:0;top:0;bottom:0;width:min(360px,100vw);z-index:40;transform:translateX(100%);transition:.25s;box-shadow:-8px 0 30px #0005}.insp.open{transform:none}
 .scrim.on{display:block;position:fixed;inset:0;background:#0005;z-index:35}.tiles{grid-template-columns:repeat(3,1fr)}.tile:nth-child(3){border-right:0}.tile:nth-child(-n+3){border-bottom:1px solid var(--line)}}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:45;transform:translateX(-100%);transition:.25s}.side.open{transform:none}
 #burger{display:block}.top .clk span{display:none}.tiles{grid-template-columns:1fr 1fr}.tile{border-bottom:1px solid var(--line)}.tile:nth-child(2n){border-right:0}.tile:nth-child(3){border-right:1px solid var(--line)}.tile:last-child{grid-column:span 2;border-bottom:0}
 .cards{grid-template-columns:1fr 1fr}.two,.twoe{grid-template-columns:1fr}.shelf{grid-template-columns:repeat(4,1fr)}.kpi{grid-template-columns:1fr 1fr}.mon{grid-template-columns:repeat(4,1fr)}.lib{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
 .hide-m{display:none}.bot{gap:10px}}
</style></head><body>
<div class="app">
<aside class="side" id="side">
 <div class="brand"><svg width="34" height="34" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="20" cy="20" r="18.5"/><path d="M10 29V17a10 10 0 0 1 20 0v12M15 29V18M20 29V14M25 29V18M8 29h24"/></svg>
  <div><b>BIBLIOTHECA</b><small>PERSONAL READING ARCHIVE<br>&amp; LIBRARY WORKSPACE</small></div></div>
 <div class="sbox"><div><span>ARCHIVE STATUS</span><span>···</span></div><div><span><span class="led"></span>LOCAL MODE</span></div><div><span>DATA INTEGRITY</span><span>OK ▪</span></div></div>
 <div class="sh">NAVIGATION</div><nav id="nav"></nav>
 <div class="sh">RECENT VIEWS</div><div class="recent" id="recent"></div>
 <div class="sys" id="sys"></div>
 <div class="ver"><span>BIBLIOTHECA v2.0</span><button class="x" style="color:var(--dk)" onclick="go('settings')" title="Settings">⚙</button></div>
</aside>
<div class="scrim" id="scrim" onclick="closeDrawers()"></div>
<div class="main">
 <div class="top"><button class="x" id="burger" onclick="side.classList.add('open');scrim.classList.add('on')">☰</button>
  <div class="clk" id="clk"></div><div class="sp"></div>
  <button onclick="pal()">+ New record <span class="kbd hide-m">/</span></button>
  <button class="x hide-m" onclick="pickNext()" title="Suggest my next book">⚄ Next read</button>
  <button class="x" onclick="toggleTheme()" title="Day / night">◐</button></div>
 <div class="content" id="view"></div>
 <div class="bot"><span>LOCAL DATABASE <b>library.db</b></span><span class="sp"></span><span class="hide-m" id="bk"></span><span>DATA INTEGRITY <span class="ok">OK ●</span></span></div>
</div>
<aside class="insp" id="insp"></aside>
</div>
<dialog id="pd" class="pal"><input id="q" placeholder="SEARCH ANY BOOK · TITLE, AUTHOR OR ISBN" autocomplete="off"><div id="res"><div class="empty">Type to search millions of books from Google Books &amp; Open Library.<br><br><span class="kbd">ESC</span> to close</div></div></dialog>
<div id="toast"></div>

<script>
/* ================= data ================= */
const K='mybooks.v1',$=s=>document.querySelector(s);
const ds=(d=new Date())=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>ds();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const M=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function load(){const d=JSON.parse(localStorage.getItem(K)||'null')||{books:[]};
 d.set={goal:24,daily:20,remind:'21:00',sources:'Physical,Kindle,Audiobook,PDF / eBook,Library,Borrowed',lastSrc:'',lastBackup:'',theme:'day',...d.set};
 d.log||={};d.mins||={};d.notes||={};d.events||=[];d.seq||=0;d.recent||=[];
 d.books.forEach(b=>{b.tags||=[];b.quotes||=[];b.added||=b.upd||Date.now();b.rid||=rid(d)});return d}
function rid(d){d.seq++;return'BK-'+new Date().getFullYear()+'-'+String(d.seq).padStart(4,'0')}
let D=load(),view='dash',sel=null,itab='details',F={q:'',st:'',src:'',tag:'',sort:'upd',mode:'grid'},R=[];
const save=()=>{localStorage.setItem(K,JSON.stringify(D));render()};
const B=id=>D.books.find(b=>b.id==id),srcs=()=>D.set.sources.split(',').map(s=>s.trim()).filter(Boolean);
const pct=b=>b.status=='finished'?100:b.total?Math.min(100,Math.round(b.cur/b.total*100)):0;
const fdt=t=>{const d=new Date(t);return String(d.getDate()).padStart(2,'0')+' '+M[d.getMonth()]+' '+d.getFullYear()};
const fdd=s=>s?fdt(s+'T12:00'):'—';
const ago=t=>{const m=(Date.now()-t)/6e4;return m<1?'just now':m<60?~~m+'m ago':m<1440?~~(m/60)+'h ago':m<2880?'yesterday':~~(m/1440)+'d ago'};
const SL={reading:'In progress',finished:'Finished',want:'To read',dropped:'Dropped'};
const cv=(b,c='')=>`<div class="cv ${c}" style="${b.cover?`background-image:url('${esc(b.cover)}')`:''}">${b.cover?'':esc(b.title)}${b.status=='finished'&&c!='nost'?'<span class="stamp">READ</span>':''}</div>`;
function ev(kind,msg,b){D.events.unshift({ts:Date.now(),kind,msg,id:b?.id});D.events.length=Math.min(D.events.length,200)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2000)}
const read=d=>(+D.log[d]||0)>0||(+D.mins[d]||0)>0;
function streak(){let n=0,d=new Date();if(!read(ds(d)))d.setDate(d.getDate()-1);while(read(ds(d))){n++;d.setDate(d.getDate()-1)}return n}
function best(){let b=0,n=0;const k=Object.keys({...D.log,...D.mins}).filter(read).sort();let p=null;for(const d of k){const x=new Date(d+'T12:00');n=p&&(x-p)/864e5<1.5?n+1:1;b=Math.max(b,n);p=x}return b}

/* ================= actions ================= */
function setCur(b,v){v=Math.max(0,+v||0);if(b.total)v=Math.min(b.total,v);const d=v-b.cur;b.cur=v;b.upd=Date.now();
 if(d>0){D.log[today()]=(+D.log[today()]||0)+d;ev('Progress',`${b.title} · +${d} pages`,b)}
 if(b.status=='want'&&v>0){b.status='reading';b.started||=today()}
 if(b.total&&v>=b.total&&b.status!='finished')return finish(b);save()}

const nk=(t,a)=>(t+'|'+(a||'').split(',')[0]).toLowerCase().replace(/[^a-z0-9|]/g,'');
async function search(q){
 const g=fetch('https://www.googleapis.com/books/v1/volumes?maxResults=16&printType=books&q='+encodeURIComponent(q)).then(r=>r.json()).then(j=>(j.items||[]).map(i=>{const v=i.volumeInfo,il=v.imageLinks;
  return{title:v.title+(v.subtitle?': '+v.subtitle:''),author:(v.authors||[]).join(', '),total:v.pageCount||0,year:(v.publishedDate||'').slice(0,4),desc:(v.description||'').replace(/<[^>]+>/g,''),cats:v.categories||[],
   isbn:(v.industryIdentifiers||[]).find(x=>x.type=='ISBN_13')?.identifier||'',cover:il?(il.thumbnail||il.smallThumbnail).replace('http:','https:').replace('&edge=curl','').replace('zoom=1','zoom=2'):''}})).catch(()=>[]);
 const o=fetch('https://openlibrary.org/search.json?limit=10&fields=title,author_name,cover_i,number_of_pages_median,first_publish_year,subject,isbn&q='+encodeURIComponent(q)).then(r=>r.json()).then(j=>j.docs.map(d=>({title:d.title,author:(d.author_name||[]).join(', '),total:d.number_of_pages_median||0,year:d.first_publish_year||'',desc:'',cats:(d.subject||[]).slice(0,2),isbn:(d.isbn||[])[0]||'',cover:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`:''}))).catch(()=>[]);
 const[a,b]=await Promise.all([g,o]),m=new Map;
 for(const x of[...a,...b]){const k=nk(x.title,x.author),p=m.get(k);if(!p)m.set(k,x);else{p.cover||=x.cover;p.total||=x.total;p.desc||=x.desc}}
 R=[...m.values()].filter(x=>x.title).sort((x,y)=>!!y.cover-!!x.cover).slice(0,20);if(q!=$('#q').value.trim())return;
 $('#res').innerHTML=R.map((x,i)=>{const h=D.books.find(b=>nk(b.title,b.author)==nk(x.title,x.author));
  return`<div class="res">${cv(x)}<div class="mm"><b>${esc(x.title)}</b><span class="m">${esc(x.author)}${x.year?' · '+x.year:''}${x.total?' · '+x.total+' p.':''}</span>
  <div class="acts">${h?`<span class="have">✓ IN ARCHIVE · ${h.rid}</span> <button class="x" onclick="pd.close();selBook('${h.id}')">Open</button>`:`<button class="solid" onclick="add(${i},'reading')">▶ Reading</button><button onclick="add(${i},'finished')">✓ Read it</button><button onclick="add(${i},'want')">+ To read</button>`}</div></div></div>`}).join('')
  +`<div class="res"><div class="mm m">Can’t find it? </div><button onclick="addManual()">+ Add “${esc(q)}” manually</button></div>`}
function mk(x,status){const b={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),rid:rid(D),title:x.title,author:x.author||'',cover:x.cover||'',total:x.total||0,cur:0,rating:0,notes:'',desc:x.desc||'',year:x.year||'',isbn:x.isbn||'',
 tags:(x.cats||[]).slice(0,2).map(c=>c.toLowerCase().split(/[\/&]/)[0].trim()).filter(Boolean),quotes:[],source:D.set.lastSrc||srcs()[0]||'',status,started:status=='reading'?today():'',finished:'',target:'',added:Date.now(),upd:Date.now()};

 <div class="row twoe"><div class="pn"><div class="ph">Daily notes</div><div class="pb">${days.length?days.slice(0,20).map(k=>`<div style="margin-bottom:10px"><div class="U s m">${fdd(k)}</div>${esc(D.notes[k])}</div>`).join(''):'<span class="m">Write a note in the Daily log on your dashboard.</span>'}</div></div>
 <div class="pn"><div class="ph">Full activity log</div><table><tbody>${D.events.slice(0,40).map(e=>`<tr><td class="m">${fdt(e.ts)}</td><td>${esc(e.msg)}</td><td><span class="badge">${e.kind}</span></td></tr>`).join('')||'<tr><td class="m">No activity yet.</td></tr>'}</tbody></table></div></div>`};

V.stats=()=>{const bs=D.books,fin=bs.filter(b=>b.status=='finished'),pages=Object.values(D.log).reduce((a,v)=>a+(+v||0),0),mins=Object.values(D.mins).reduce((a,v)=>a+(+v||0),0);
 const rated=fin.filter(b=>b.rating),avg=rated.length?(rated.reduce((a,b)=>a+b.rating,0)/rated.length).toFixed(1):'—';
 const dur=fin.filter(b=>b.started&&b.finished).map(b=>(new Date(b.finished)-new Date(b.started))/864e5),ad=dur.length?Math.round(dur.reduce((a,b)=>a+b,0)/dur.length):'—';
 const grp=(f)=>{const m={};bs.forEach(b=>{for(const k of[].concat(f(b)))if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8)};
 const bars=(a)=>{const mx=Math.max(1,...a.map(x=>x[1]));return a.map(([k,v])=>`<div class="hbar"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k)}</span><div class="pbar"><i style="width:${v/mx*100}%"></i></div><b style="text-align:right">${v}</b></div>`).join('')||'<span class="m">No data yet.</span>'};
 const y=new Date().getFullYear(),bm=M.map((m,i)=>[m,fin.filter(b=>b.finished?.startsWith(y+'-'+String(i+1).padStart(2,'0'))).length]);
 const longest=fin.filter(b=>b.total).sort((a,b)=>b.total-a.total)[0];
 return`<div class="kpi"><div><div class="U s m">Books finished</div><div class="big">${fin.length}</div></div><div><div class="U s m">Pages logged</div><div class="big">${pages.toLocaleString()}</div></div>
 <div><div class="U s m">Hours reading</div><div class="big">${(mins/60).toFixed(1)}</div></div><div><div class="U s m">Avg rating</div><div class="big">${avg}${avg!='—'?'<span style="font-size:14px">/5</span>':''}</div></div></div>
 <div class="row twoe"><div class="pn"><div class="ph">Finished per month · ${y}</div><div class="pb">${bars(bm)}</div></div>
 <div class="pn"><div class="ph">By source</div><div class="pb">${bars(grp(b=>b.source))}</div></div></div>
 <div class="row twoe"><div class="pn"><div class="ph">Top authors</div><div class="pb">${bars(grp(b=>b.author.split(',')[0]))}</div></div>
 <div class="pn"><div class="ph">Top tags</div><div class="pb">${bars(grp(b=>b.tags))}</div></div></div>
 <div class="pn"><div class="ph">Records</div><div class="pb kv2" style="margin:0">
 <span>Avg days to finish</span><span>${ad}</span><span>Longest book</span><span>${longest?esc(longest.title)+' · '+longest.total+' p.':'—'}</span><span>Best streak</span><span>${best()} days</span>
 <span>Completion rate</span><span>${bs.length?Math.round(fin.length/bs.length*100):0}% of archive</span><span>Quotes saved</span><span>${bs.reduce((a,b)=>a+b.quotes.length,0)}</span></div></div>`};

 if(!b){const w=D.books.filter(x=>x.status=='want').length;I.innerHTML=`<div class="ih">RECORD INSPECTOR</div><div class="ib"><div class="empty" style="padding-top:60px"><b>NO RECORD SELECTED</b>Select a book to see its record, progress, notes and quotes.<br><br><button class="solid" onclick="pal()">+ New record</button>${w?`<br><br><button onclick="pickNext()">⚄ Suggest my next read</button>`:''}</div>

 const p=pct(b),dl=b.target&&b.status=='reading'&&b.total?Math.max(1,Math.round((new Date(b.target)-new Date(today()))/864e5)):0,need=dl?Math.ceil((b.total-b.cur)/dl):0;
 const same=D.books.filter(x=>x!=b&&x.author&&x.author.split(',')[0]==b.author.split(',')[0]);

 I.innerHTML=`<div class="ih">RECORD INSPECTOR<span><button class="x" onclick="sel=null;closeDrawers();render()" title="Close">✕</button></span></div><div class="ib">
 <div class="sec"><h5>RECORD ID</h5><div class="rid">${b.rid}<span class="s m" style="font-weight:400">${esc(b.source)}</span></div>
  <div class="kv2"><span>Status</span><select onchange="setStatus(B(sel),this.value)">${Object.entries(SL).map(([k,l])=>`<option value="${k}" ${b.status==k?'selected':''}>${l}</option>`).join('')}</select>
  <span>Source</span><select onchange="const b=B(sel);b.source=this.value;D.set.lastSrc=this.value;b.upd=Date.now();save()">${[...new Set([...srcs(),b.source].filter(Boolean))].map(s=>`<option ${b.source==s?'selected':''}>${esc(s)}</option>`).join('')}</select></div></div>
 <div class="sec"><div class="icv">${cv(b,'nost')}<div style="min-width:0"><h2 class="ititle">${esc(b.title)}</h2><div class="m">${esc(b.author)||'Unknown author'}</div>${b.year?`<div class="s m">${b.year}${b.total?' · '+b.total+' pages':''}</div>`:''}
  <div class="stars" style="margin-top:6px">${[1,2,3,4,5].map(n=>`<button class="${b.rating>=n?'on':''}" onclick="const b=B(sel);b.rating=b.rating==${n}?0:${n};save()">★</button>`).join('')}</div></div></div></div>

 ${itab=='details'?`

 <div class="sec"><h5>PROGRESS</h5><div class="ring"><svg width="84" height="84" viewBox="0 0 60 60"><circle cx="30" cy="30" r="25" fill="none" stroke="var(--soft)" stroke-width="5"/><circle cx="30" cy="30" r="25" fill="none" stroke="var(--ink)" stroke-width="5" stroke-dasharray="${p/100*157} 157" transform="rotate(-90 30 30)"/><text x="30" y="34" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor" font-family="IBM Plex Mono">${p}%</text></svg>
  <div class="ms" style="flex:1"><div class="U s m">MILESTONES</div>${[[25,'Quarter'],[50,'Halfway'],[75,'Final stretch'],[100,'Finished']].map(([v,l])=>`<div class="${p>=v?'dn':'m'}"><span>${l}</span><span>${p>=v?'✓':'○'}</span></div>`).join('')}</div></div>
  <div style="display:flex;gap:6px;align-items:center;margin-top:10px"><span class="m s">PAGE</span><input type="number" min="0" value="${b.cur}" style="width:74px" onchange="setCur(B(sel),this.value)"><span class="m s">OF</span><input type="number" min="0" value="${b.total}" style="width:74px" onchange="const b=B(sel);b.total=+this.value||0;save()"></div>
  ${b.status!='finished'?`<div style="display:flex;gap:6px;margin-top:8px"><button onclick="setCur(B(sel),B(sel).cur+10)">+10</button><button onclick="setCur(B(sel),B(sel).cur+25)">+25</button><button onclick="timer()">${D.timer?'■ Stop':'▶ Session'}</button><button class="solid" style="flex:1" onclick="finish(B(sel))">✓ Finished</button></div>`:''}
  ${need?`<div class="s" style="margin-top:8px">▸ Read <b>${need} pages/day</b> to finish by ${fdd(b.target)}</div>`:''}</div>

  <input placeholder="+ add tag" style="width:100px;padding:1px 6px;font-size:10.5px" onkeydown="if(event.key=='Enter'&&this.value.trim()){const b=B(sel),v=this.value.trim().toLowerCase();if(!b.tags.includes(v))b.tags.push(v);save()}"></div></div>
 ${same.length?`<div class="sec linked"><h5>MORE BY THIS AUTHOR IN ARCHIVE</h5>${same.map(x=>`<div onclick="selBook('${x.id}')"><span>${esc(x.title)}</span><span class="m"><span class="dot st-${x.status}"></span></span></div>`).join('')}</div>`:''}
 <div class="sec"><details><summary>EDIT RECORD</summary><div class="kv2"><span>Title</span><input value="${esc(b.title)}" onchange="B(sel).title=this.value;save()"><span>Author</span><input value="${esc(b.author)}" onchange="B(sel).author=this.value;save()">
  <span>Cover URL</span><input value="${esc(b.cover)}" onchange="B(sel).cover=this.value;save()"></div></details>
  <div style="display:flex;gap:6px;margin-top:12px"><a class="s m" style="cursor:pointer" target="_blank" href="https://www.google.com/search?q=${encodeURIComponent(b.title+' '+b.author+' book')}">↗ Look up online</a><span class="sp"></span><button class="x" style="color:var(--red)" onclick="del(B(sel))">Delete record</button></div></div>`

  <div class="sec">${b.quotes.map((q,i)=>`<div class="quote">“${esc(q.text)}”<small>${q.page?'p.'+q.page+' · ':''}${fdt(q.ts)} · <a style="cursor:pointer" onclick="B(sel).quotes.splice(${i},1);save()">remove</a></small></div>`).join('')||'<span class="m">No quotes yet.</span>'}</div>`
 :`<div class="sec"><h5>ACTIVITY</h5>${D.events.filter(e=>e.id==b.id).map(e=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--soft)"><span>${esc(e.msg.replace(b.title+' · ',''))}</span><span class="m s" style="white-space:nowrap">${fdt(e.ts)}</span></div>`).join('')||'<span class="m">No activity yet.</span>'}</div>`}
 </div>`}

/* ================= import / export ================= */
function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
function exportJSON(){D.set.lastBackup=Date.now();save();dl('bibliotheca-'+today()+'.json',JSON.stringify(D),'application/json');toast('Backup exported')}
function exportCSV(){const c=['id','title','author','source','status','pages','current','rating','started','finished','tags','notes'],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 dl('bibliotheca-'+today()+'.csv',[c.join(','),...D.books.map(b=>[b.rid,b.title,b.author,b.source,b.status,b.total,b.cur,b.rating,b.started,b.finished,b.tags.join(' '),b.notes].map(q).join(','))].join('\n'),'text/csv')}
function csv(t){const R=[];let r=[''],q=0;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'&&t[i+1]=='"'){r[r.length-1]+='"';i++}else if(c=='"')q=0;else r[r.length-1]+=c}else if(c=='"')q=1;else if(c==',')r.push('');else if(c=='\n'){R.push(r);r=['']}else if(c!='\r')r[r.length-1]+=c}if(r.length>1||r[0])R.push(r);return R}
async function importFile(f){if(!f)return;const t=await f.text();
 if(f.name.endsWith('.json')){if(confirm('Replace your archive with this backup?')){localStorage.setItem(K,t);D=load();save();toast('Backup restored')}return}
 const[h,...rows]=csv(t),ix=n=>h.indexOf(n),sm={read:'finished','currently-reading':'reading','to-read':'want'};let n=0;
 for(const r of rows){const title=r[ix('Title')];if(!title||D.books.some(b=>b.title==title))continue;const isbn=(r[ix('ISBN13')]||'').replace(/\D/g,''),s=sm[r[ix('Exclusive Shelf')]]||'want';
  const b=mk({title,author:r[ix('Author')],total:+r[ix('Number of Pages')]||0,isbn,year:r[ix('Original Publication Year')]||'',cover:isbn?`https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`:''},s);
  b.rating=+r[ix('My Rating')]||0;if(s=='finished'){b.finished=(r[ix('Date Read')]||'').replace(/\//g,'-');b.cur=b.total}n++}
 save();toast(n+' books imported from Goodreads')}

/* ================= reminders ================= */
async function askNotif(){if(!('Notification'in window))return toast('Notifications not supported here');const p=await Notification.requestPermission();if(p=='granted')notify('📚 Reminders on','I’ll nudge you daily at '+D.set.remind);else toast('Blocked in browser settings');render()}
function notify(t,body){navigator.serviceWorker?.ready.then(s=>s.showNotification(t,{body,icon:'icon.svg',badge:'icon.svg'})).catch(()=>new Notification(t,{body}))}
function checkRemind(){if(!('Notification'in window)||Notification.permission!='granted'||!D.set.remind)return;
 if(new Date().toTimeString().slice(0,5)<D.set.remind||localStorage.getItem('remindDay')==today())return;localStorage.setItem('remindDay',today());
 const r=D.books.filter(b=>b.status=='reading').sort((a,b)=>b.upd-a.upd)[0],pt=+D.log[today()]||0,dl=+D.set.daily||20;
 notify('📚 Time to read',pt>=dl?`Target hit today (${pt} pages). A few more?`:r?`“${r.title}” is ${pct(r)}% done. ${dl-pt} pages to hit today’s target${streak()?' and keep your '+streak()+'-day streak':''}.`:'Pick your next book from your to-read list.')}
setInterval(checkRemind,60000);document.addEventListener('visibilitychange',checkRemind);
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key=='/'||(e.key=='k'&&(e.metaKey||e.ctrlKey))){e.preventDefault();pal()}else if(e.key=='n')pickNext();else if(e.key=='Escape'){sel=null;closeDrawers();render()}});
if('serviceWorker'in navigator&&location.protocol!='file:')navigator.serviceWorker.register('sw.js');
render();checkRemind();
</script></body></html>
