<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Books</title>
<meta name="theme-color" content="#2f5d50">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--mut:#777;--acc:#2f5d50;--done:#2e8b57;--read:#d98b1c;--want:#8a8f98;--line:#e3dfd6}
@media(prefers-color-scheme:dark){:root{--bg:#16181b;--card:#22252a;--ink:#eee;--mut:#9aa;--line:#33373d}}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--acc);color:#fff;padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font-size:20px;margin:0;flex:1}
button,select,input{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{cursor:pointer}.pri{background:var(--acc);color:#fff;border:0}header button{background:#ffffff22;color:#fff;border:0}
main{max-width:1100px;margin:auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:12px;padding:12px;border:1px solid var(--line)}.stat b{font-size:24px;display:block}.stat small{color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--done)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters input{flex:1;min-width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.book{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line);cursor:pointer;position:relative}
.cover{aspect-ratio:2/3;background:#c9c2b3 center/cover;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;color:#333;font-weight:600}
.book.finished .cover::after{content:"✓ FINISHED";position:absolute;top:8px;left:8px;background:var(--done);color:#fff;font-size:11px;padding:3px 7px;border-radius:6px}
.book.want .cover{filter:grayscale(.7);opacity:.75}
.info{padding:8px}.info .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.info small{color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;background:var(--line);margin-top:4px}
dialog{border:0;border-radius:14px;background:var(--card);color:var(--ink);width:min(520px,94vw);padding:18px}dialog::backdrop{background:#0008}
form label{display:block;margin:8px 0 2px;font-size:13px;color:var(--mut)}form input,form select,form textarea{width:100%}
.row{display:flex;gap:8px}.row>*{flex:1}.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.res{display:flex;gap:10px;align-items:center;padding:6px;border-bottom:1px solid var(--line);cursor:pointer}.res img{width:40px}
.empty{text-align:center;color:var(--mut);padding:40px}
</style></head><body>
<header><h1>📚 My Books</h1>
<button onclick="openEdit()">+ Add</button><button onclick="dlg('search')">Search</button><button onclick="dlg('settings')">⚙</button></header>
<main>
<div class="stats" id="stats"></div>
<div class="filters">
<input id="q" placeholder="Search my books…" oninput="render()">
<select id="fs" onchange="render()"><option value="">All status</option><option value="reading">Reading</option><option value="finished">Finished</option><option value="want">Want to read</option><option value="dropped">Dropped</option></select>
<select id="fsrc" onchange="render()"><option value="">All sources</option></select>
<select id="sort" onchange="render()"><option value="upd">Recently updated</option><option value="title">Title</option><option value="prog">Progress</option></select>
</div>
<div class="grid" id="grid"></div>
</main>

<dialog id="edit"><form method="dialog" id="ef">
<h3 id="etitle">Book</h3>
<label>Title</label><input name="title" required>
<label>Author</label><input name="author">
<div class="row"><div><label>Source</label><select name="source"></select></div>
<div><label>Status</label><select name="status"><option value="want">Want to read</option><option value="reading">Reading</option><option value="finished">Finished</option><option value="dropped">Dropped</option></select></div></div>
<div class="row"><div><label>Progress (page / %)</label><input name="cur" type="number" min="0"></div><div><label>Total pages (100 for %)</label><input name="total" type="number" min="0"></div></div>
<div class="row"><div><label>Started</label><input name="started" type="date"></div><div><label>Finished</label><input name="finished" type="date"></div></div>
<div class="row"><div><label>Rating</label><select name="rating"><option value="0">–</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div><label>Cover image URL</label><input name="cover"></div></div>
<label>Notes</label><textarea name="notes" rows="2"></textarea>
<div class="acts"><button type="button" id="del" onclick="delBook()">Delete</button><button value="cancel" formnovalidate>Cancel</button><button class="pri" value="ok">Save</button></div>
</form></dialog>

<dialog id="search"><h3>Find a book (Open Library)</h3>
<div class="row"><input id="olq" placeholder="Title or author" onkeydown="if(event.key=='Enter')ol()"><button class="pri" onclick="ol()" style="flex:0">Go</button></div>
<div id="olr" style="max-height:50vh;overflow:auto;margin-top:8px"></div>
<div class="acts"><button onclick="search.close()">Close</button></div></dialog>

<dialog id="settings"><h3>Settings</h3>
<form id="sf" onsubmit="return false">
<label>Yearly goal (books)</label><input name="goal" type="number" min="1">
<label>Daily reading reminder</label><div class="row"><input name="remind" type="time"><button type="button" onclick="askNotif()">Enable notifications</button></div>
<label>Sources (comma separated)</label><input name="sources">
</form>
<label>Backup</label><div class="acts" style="justify-content:flex-start">
<button onclick="exportJSON()">Export backup</button><button onclick="imp.click()">Import backup / Goodreads CSV</button></div>
<input type="file" id="imp" accept=".json,.csv" hidden onchange="importFile(this.files[0])">
<div class="acts"><button class="pri" onclick="saveSettings()">Save</button></div></dialog>

<script>
const K='mybooks.v1',$=s=>document.querySelector(s);
let D=JSON.parse(localStorage.getItem(K)||'null')||{books:[],log:{},set:{goal:24,remind:'21:00',sources:'Physical,Kindle,Audible,PDF / eBook,Library,Borrowed,Web / Online'}};
const save=()=>localStorage.setItem(K,JSON.stringify(D)),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let cur=null;
const srcs=()=>D.set.sources.split(',').map(s=>s.trim()).filter(Boolean);
const pct=b=>b.status=='finished'?100:b.total?Math.min(100,Math.round(b.cur/b.total*100)):0;

function streak(){let n=0,d=new Date();if(!D.log[today()])d.setDate(d.getDate()-1);while(D.log[d.toISOString().slice(0,10)]){n++;d.setDate(d.getDate()-1)}return n}
function render(){
 const y=new Date().getFullYear()+'',B=D.books,fin=B.filter(b=>b.status=='finished'),fy=fin.filter(b=>(b.finished||'').startsWith(y)).length,g=+D.set.goal||1;
 $('#stats').innerHTML=`<div class="stat"><b>${fin.length}</b><small>finished of ${B.length} books</small></div>
 <div class="stat"><b>${fy}/${g}</b><small>${y} goal</small><div class="bar"><i style="width:${Math.min(100,fy/g*100)}%"></i></div></div>
 <div class="stat"><b>${B.filter(b=>b.status=='reading').length}</b><small>reading now</small></div>
 <div class="stat"><b>🔥 ${streak()}</b><small>day streak</small></div>
 <div class="stat"><small>${srcs().map(s=>{const t=B.filter(b=>b.source==s);return t.length?`${esc(s)}: ${t.filter(b=>b.status=='finished').length}/${t.length}`:''}).filter(Boolean).join('<br>')||'by source'}</small></div>`;
 const fs=$('#fsrc'),v=fs.value;fs.innerHTML='<option value="">All sources</option>'+srcs().map(s=>`<option>${esc(s)}</option>`).join('');fs.value=v;
 const q=$('#q').value.toLowerCase(),st=$('#fs').value,so=$('#sort').value;
 let L=B.filter(b=>(!st||b.status==st)&&(!fs.value||b.source==fs.value)&&(b.title+' '+b.author).toLowerCase().includes(q));
 L.sort(so=='title'?(a,b)=>a.title.localeCompare(b.title):so=='prog'?(a,b)=>pct(b)-pct(a):(a,b)=>b.upd-a.upd);
 $('#grid').innerHTML=L.map(b=>`<div class="book ${b.status}" onclick="openEdit('${b.id}')">
 <div class="cover" style="${b.cover?`background-image:url('${esc(b.cover)}')`:''}">${b.cover?'':esc(b.title)}</div>
 ${b.status=='reading'?`<div class="bar" style="margin:0;border-radius:0"><i style="width:${pct(b)}%;background:var(--read)"></i></div>`:''}
 <div class="info"><div class="t">${esc(b.title)}</div><small>${esc(b.author)}</small><br>
 <span class="tag">${esc(b.source)}</span> ${b.status=='reading'?`<span class="tag">${pct(b)}%</span>`:''}${b.rating>0?' '+'★'.repeat(b.rating):''}</div></div>`).join('')||'<div class="empty">No books yet. Tap “+ Add” or “Search”.</div>';
}
function openEdit(id,pre){
 const f=$('#ef');cur=id?D.books.find(b=>b.id==id):null;const b=cur||pre||{status:'want',source:srcs()[0]};
 f.source.innerHTML=srcs().map(s=>`<option>${esc(s)}</option>`).join('');
 for(const k of['title','author','source','status','cur','total','started','finished','rating','cover','notes'])f[k].value=b[k]??'';
 if(!f.rating.value)f.rating.value='0';$('#del').hidden=!cur;$('#etitle').textContent=cur?'Edit book':'Add book';$('#edit').showModal();
}
$('#ef').onsubmit=e=>{
 if(e.submitter?.value!='ok')return;const f=e.target,o={};
 for(const k of['title','author','source','status','started','finished','cover','notes'])o[k]=f[k].value.trim();
 for(const k of['cur','total','rating'])o[k]=+f[k].value||0;
 if(o.status=='finished'&&!o.finished)o.finished=today();if(o.status=='reading'&&!o.started)o.started=today();
 if(!cur||o.cur!=cur.cur||o.status!=cur.status)D.log[today()]=1;
 o.upd=Date.now();if(cur)Object.assign(cur,o);else D.books.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random(),...o});
 save();render();
};
function delBook(){if(confirm('Delete this book?')){D.books=D.books.filter(b=>b!==cur);save();render();$('#edit').close()}}
function dlg(id){if(id=='settings'){const f=$('#sf');for(const k in D.set)f[k].value=D.set[k]}$('#'+id).showModal()}
async function ol(){
 const r=$('#olr');r.textContent='Searching…';
 try{const j=await(await fetch('https://openlibrary.org/search.json?limit=15&fields=title,author_name,cover_i,number_of_pages_median&q='+encodeURIComponent($('#olq').value))).json();
 window._ol=j.docs;r.innerHTML=j.docs.map((d,i)=>`<div class="res" onclick="pick(${i})">${d.cover_i?`<img src="https://covers.openlibrary.org/b/id/${d.cover_i}-S.jpg">`:''}<div><b>${esc(d.title)}</b><br><small>${esc((d.author_name||[]).join(', '))}</small></div></div>`).join('')||'No results';}catch{r.textContent='Search failed (offline?)'}
}
function pick(i){const d=_ol[i];$('#search').close();openEdit(null,{title:d.title,author:(d.author_name||[])[0]||'',total:d.number_of_pages_median||'',cover:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg`:'',status:'want',source:srcs()[0]})}
function saveSettings(){const f=$('#sf');for(const k in D.set)D.set[k]=f[k].value;save();render();$('#settings').close()}
function exportJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='my-books-'+today()+'.json';a.click()}
function csv(t){const R=[];let r=[''],q=0;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'&&t[i+1]=='"'){r[r.length-1]+='"';i++}else if(c=='"')q=0;else r[r.length-1]+=c}else if(c=='"')q=1;else if(c==',')r.push('');else if(c=='\n'){R.push(r);r=['']}else if(c!='\r')r[r.length-1]+=c}if(r.length>1||r[0])R.push(r);return R}
async function importFile(file){
 if(!file)return;const t=await file.text();
 if(file.name.endsWith('.json')){if(confirm('Replace all data with this backup?')){D=JSON.parse(t);save();render()}return}
 const [h,...rows]=csv(t),ix=n=>h.indexOf(n);let n=0;
 const sm={read:'finished','currently-reading':'reading','to-read':'want'};
 for(const r of rows){const title=r[ix('Title')];if(!title||D.books.some(b=>b.title==title))continue;
  const isbn=(r[ix('ISBN13')]||'').replace(/\D/g,'');
  D.books.push({id:Date.now()+''+n,title,author:r[ix('Author')]||'',source:'Physical',status:sm[r[ix('Exclusive Shelf')]]||'want',cur:0,total:+r[ix('Number of Pages')]||0,rating:+r[ix('My Rating')]||0,finished:(r[ix('Date Read')]||'').replace(/\//g,'-'),started:'',notes:'Imported from Goodreads',cover:isbn?`https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false`:'',upd:Date.now()-n});n++}
 save();render();alert(n+' books imported from Goodreads');
}
// Reminders: fire at the chosen time while the app is open/installed, once per day
async function askNotif(){const p=await Notification.requestPermission();alert(p=='granted'?'Notifications on':'Notifications blocked in browser settings')}
function checkRemind(){
 if(!('Notification'in window)||Notification.permission!='granted'||!D.set.remind)return;
 const now=new Date(),hm=now.toTimeString().slice(0,5);if(hm<D.set.remind||localStorage.getItem('remindDay')==today())return;
 localStorage.setItem('remindDay',today());const r=D.books.filter(b=>b.status=='reading');
 const body=D.log[today()]?'Nice, you already read today. A few more pages?':r.length?`Continue "${r[0].title}" (${pct(r[0])}%) and keep your ${streak()}-day streak!`:'Pick your next book from your list!';
 navigator.serviceWorker?.ready.then(s=>s.showNotification('📚 Time to read',{body,icon:'icon.svg'})).catch(()=>new Notification('📚 Time to read',{body}));
}
setInterval(checkRemind,60000);document.addEventListener('visibilitychange',checkRemind);
if('serviceWorker'in navigator&&location.protocol!='file:')navigator.serviceWorker.register('sw.js');
render();checkRemind();
</script></body></html>
